name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # No cloud credentials in CI. Nothing here may fall back to an ambient chain.
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_CONFIG_FILE: /dev/null
  AWS_SHARED_CREDENTIALS_FILE: /dev/null
  UV_PYTHON: "3.12"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.2"
      # pyBigWig is built from source (pyproject [tool.uv] no-binary-package) so it has libcurl
      # remote support; samtools/bcftools/tabix are the scientific oracles for reader tests.
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev zlib1g-dev samtools bcftools tabix
      - name: System dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install samtools bcftools htslib
      - run: samtools --version | head -2 && bcftools --version | head -1 && tabix --version | head -1
      - run: uv sync --locked
      - name: pyBigWig has remote (libcurl) support
        run: uv run python -c "import pyBigWig, sys; print('pyBigWig.remote =', pyBigWig.remote); sys.exit(0 if pyBigWig.remote else 1)"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
        env:
          GENOMICS_MCP_REQUIRE_ORACLES: "1"
      - run: uv run genomics-mcp --help
      - run: uv build

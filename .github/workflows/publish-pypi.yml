name: publish-pypi

# Manual. Uploads the wheel and sdist attached to GitHub release v<version> to PyPI with
# trusted publishing (OIDC, no token). Requires a PyPI (pending) trusted publisher for project
# rewire-genomics-mcp, owner rewire-bio, repository genomics-mcp, workflow publish-pypi.yml,
# environment pypi. See docs/release.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version (GitHub release v<version> must exist)"
        required: true
        type: string

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"
  UV_NO_CONFIG: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.2"
      - name: Download and verify release files
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/rewire-genomics-mcp/$VERSION/json")"
          if [ "$code" = 200 ]; then echo "rewire-genomics-mcp $VERSION is already on PyPI" >&2; exit 1; fi
          mkdir dist
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir dist \
            -p "rewire_genomics_mcp-$VERSION*" -p requirements.lock.txt -p SHA256SUMS
          (cd dist && sha256sum --check --ignore-missing SHA256SUMS && rm SHA256SUMS)
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev zlib1g-dev
      - run: python3 scripts/check_dist.py dist --install "$RUNNER_TEMP/clean-venv"
      - run: uvx --from twine==7.0.0 twine check --strict dist/*.whl dist/*.tar.gz
      - run: rm dist/requirements.lock.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-dist
          path: dist/

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

[project]
name = "rewire-genomics-mcp"
version = "0.1.0"
description = "MCP server for bounded genomic data retrieval and versioned reference evidence"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [{ name = "Tim Richardson" }]
keywords = ["mcp", "genomics", "bioinformatics", "htslib", "ega", "ena"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "mcp==2.2.0",
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "pysam==0.24.1",
    "pyBigWig==0.3.26",
    "numpy==2.5.3",
    "boto3==1.43.102",
    "uvicorn==0.53.0",
    "starlette==1.7.0",
]

[project.optional-dependencies]
# Optional AlphaGenome Atlas transport (official client, gRPC). Needs an explicitly configured
# key: [sources.alphagenome_atlas] api_key_env = "...". Without it Atlas stays disabled.
atlas = ["alphagenome==0.9.0"]

[project.urls]
Repository = "https://github.com/rewire-bio/genomics-mcp"

[project.scripts]
genomics-mcp = "genomics_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.8",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genomics_mcp"]

[tool.uv]
required-version = ">=0.8"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = [
    "network: requires public internet (skipped unless GENOMICS_MCP_NETWORK_TESTS=1)",
    "live: calls public reference services (skipped unless GENOMICS_MCP_LIVE=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF", "ASYNC"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "BLE"]

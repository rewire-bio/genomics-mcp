# genomics-mcp example configuration. Pass with --config or GENOMICS_MCP_CONFIG.
# Secrets are never written here: name the environment variable that holds them.

[paths]
# Local directories tools may read. Empty means no local files.
allowed_roots = ["~/genomics/data"]
# Downloads, prepared indexes and references. Must be writable.
work_dir = "~/.cache/genomics-mcp"

[limits]
max_region_bp = 1000000
max_records = 10000
max_response_bytes = 1048576
interactive_timeout_s = 30
max_transfer_bytes = 104857600           # without an explicit caller budget
transfer_budget_ceiling_bytes = 21474836480
workspace_max_bytes = 53687091200

[http]
host = "127.0.0.1"
port = 8765
path = "/mcp"
token_env = "GENOMICS_MCP_HTTP_TOKEN"    # or: token_file = "~/.config/genomics-mcp/token"
allow_non_loopback = false

[logging]
level = "INFO"
log_query_content = false

# In-memory cache of public file ranges and public API responses (docs/performance.md).
# Unreleased: development checkout only. Release 0.1.0 rejects a [cache] section.
# Nothing is written to disk; restarting the server clears it.
# GENOMICS_MCP_CACHE_ENABLED=0 also turns it off. Defaults shown:
# [cache]
# enabled = true
# max_bytes = 67108864                   # 64 MiB
# max_entries = 4096
# ttl_s = 300                            # Cache-Control max-age may shorten it

# Optional SRA Toolkit for convert_sra_run (docs/sra-toolkit.md). Unreleased: development
# checkout only; release 0.1.0 rejects this section. GENOMICS_MCP_SRA_TOOLKIT_DIR sets bin_dir.
# Without bin_dir, prefetch and fasterq-dump are looked up on PATH. threads and timeout_s show
# the defaults:
# [sra_toolkit]
# bin_dir = "~/opt/sratoolkit.3.4.1-mac-arm64/bin"
# threads = 4                            # fasterq-dump --threads
# timeout_s = 3600                       # per job, download included

# Storage. Loopback/private hosts and plain http are refused unless listed here
# (e.g. a local fixture server). S3 profile endpoints are allowed implicitly.
# [storage]
# local_network_hosts = ["127.0.0.1"]
# allow_public_s3 = true

# Personal S3-compatible storage. AWS_* variable names are refused on purpose.
# [storage.profiles.minio]
# endpoint_url = "http://127.0.0.1:9000"
# region = "us-east-1"
# access_key_id_env = "MINIO_ACCESS_KEY"
# secret_access_key_env = "MINIO_SECRET_KEY"
# addressing_style = "path"
# requester_pays = false

# Per-source overrides. Config can slow a source down, not exceed its documented rate.
# [sources.clinvar]
# api_key_env = "NCBI_API_KEY"
# [sources.alphagenome_atlas]
# enabled = true
# api_key_env = "ALPHAGENOME_API_KEY"
